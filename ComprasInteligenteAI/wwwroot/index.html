<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Compras Inteligente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">

</head>

<body>

    <div class="container py-5">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white text-center py-4">

                <h2>
                    <i class="bi bi-robot"></i>
                    AI Compras Inteligente
                </h2>

                <p class="mb-0">
                    Sistema de análise inteligente de solicitações de compra
                </p>

            </div>

            <div class="card-body p-4">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Solicitante
                        </label>

                        <input id="solicitante"
                               class="form-control"
                               placeholder="Nome do solicitante">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Departamento
                        </label>

                        <select id="departamento"
                                class="form-select">

                            <option value="">Selecione...</option>
                            <option>TI</option>
                            <option>Financeiro</option>
                            <option>RH</option>
                            <option>Compras</option>
                            <option>Marketing</option>
                            <option>Operações</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Valor estimado
                        </label>

                        <input id="valor"
                               type="number"
                               class="form-control"
                               placeholder="0,00">

                    </div>

                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Data da solicitação
                        </label>

                        <input id="data"
                               type="date"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Descrição da compra
                    </label>

                    <textarea id="descricao"
                              rows="5"
                              class="form-control"
                              placeholder="Descreva detalhadamente a solicitação de compra..."></textarea>

                </div>

                <!-- Mensagens -->
                <div id="mensagem"
                     class="alert d-none mb-4"
                     role="alert">
                </div>

                <div class="text-center">

                    <button id="btnAnalisar"
                            class="btn btn-primary btn-lg">

                        <span id="spinner"
                              class="spinner-border spinner-border-sm me-2 d-none">
                        </span>

                        <i id="iconeBotao"
                           class="bi bi-stars">
                        </i>

                        Analisar Compra

                    </button>

                </div>

            </div>

        </div>

        <div id="resultado"
             class="card shadow mt-5 d-none">

            <div class="card-header">

                <h4>

                    <i class="bi bi-clipboard-data"></i>

                    Resultado da Análise

                </h4>

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4">

                        <div class="resultado-card categoria">

                            <h5>Categoria</h5>

                            <h4 id="categoria"></h4>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="resultado-card prioridade">

                            <h5>Prioridade</h5>

                            <h4 id="prioridade"></h4>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="resultado-card risco">

                            <h5>Risco</h5>

                            <h4 id="risco"></h4>

                        </div>

                    </div>

                </div>

                <div class="info-card">

                    <h5>

                        <i class="bi bi-card-text"></i>

                        Justificativa

                    </h5>

                    <p id="justificativa"></p>

                </div>

                <div class="info-card">

                    <h5>

                        <i class="bi bi-lightbulb"></i>

                        Sugestão

                    </h5>

                    <p id="sugestao"></p>

                </div>

            </div>

        </div>

        <footer>

            Projeto desenvolvido em ASP.NET Core Web API com integração à API da Groq.

        </footer>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
